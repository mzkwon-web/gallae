<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>갈래 | 양방향 필드테스트</title><style>
:root{--bg:#f6f6f2;--card:#fff;--ink:#171717;--muted:#666;--line:#ddd;--live:#08783e;--warn:#a34b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:28px 18px 80px}.top{display:flex;justify-content:space-between}.brand{font-size:22px;font-weight:900}a{color:inherit}.hero{margin:42px 0 26px}h1{font-size:clamp(38px,8vw,72px);line-height:1;margin:8px 0}.muted,.detail{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:14px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}.segments{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.segments button,.route-button{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit;font-weight:800}.segments button.active,.route-button.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.route{border:1px solid var(--line);border-radius:16px;padding:16px}.route h3{margin:0 0 8px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#eee}.fresh{color:var(--live)}.stale{color:var(--warn)}.diagnostic{font-size:12px;line-height:1.6;color:var(--muted);word-break:break-word}.route-button{width:100%;margin-top:10px}@media(max-width:650px){.grid,.row{grid-template-columns:1fr}}</style></head><body><main>
<div class="top"><div class="brand">갈래</div><a href="./">소개</a></div><div class="hero"><div class="eyebrow">GALLE v0.1 · Field Test</div><h1 id="direction-title">집 → 시흥</h1><p class="muted">시흥은 시흥여성인력개발센터를 의미합니다. 방향 선택은 경로·실시간·ETA·버스 판단 전체에 적용됩니다.</p></div>
<section class="card"><div class="eyebrow">현재 이동 방향</div><div class="segments"><button data-direction="outbound" class="active">집 → 시흥</button><button data-direction="inbound">시흥 → 집</button></div></section>
<section class="card"><div class="eyebrow">후보 경로</div><h2>어느 역 경로를 이용할까요?</h2><div class="grid" id="routes"></div></section>
<section class="card"><div class="eyebrow">Rolling decision</div><h2 id="decision-title">판단 데이터 확인 중</h2><div id="decision" class="detail"></div></section>
<section class="card"><div class="eyebrow">Realtime · Line 7</div><h2 id="line7-title"></h2><p id="line7-summary">Vercel 원응답 확인 중</p><div id="line7-diag" class="diagnostic"></div><div id="line7-arrivals"></div></section>
<section class="card"><div class="eyebrow">Realtime · Line 1</div><h2 id="line1-title"></h2><p id="line1-summary">Pages snapshot 확인 중</p><div id="line1-diag" class="diagnostic"></div><div id="line1-arrivals"></div></section>
<section class="card"><div class="eyebrow">Bus · Route matched only</div><h2 id="bus-title"></h2><p id="bus-summary">정류장/노선 방향 mapping 확인 중</p><div id="bus-diag" class="diagnostic"></div><div id="bus-arrivals"></div></section>
</main><script src="./lib/source-types.js"></script><script>
const $=s=>document.querySelector(s),esc=(v='')=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const SOURCE_LABELS=globalThis.GallaeSourceTypes?.LABELS||{};const state={direction:'outbound',route:'gasan7',line7:null,line1:null,bus:null,runtime:null};
const ROUTES={outbound:[['gasan7','가산디지털단지역 · 7호선','집 → 가산 → 석남 방향 → 시흥센터'],['doksan1','독산역 · 1호선','집 → 독산 → 구로 방향 → 시흥센터']],inbound:[['gasan7','가산디지털단지역 · 7호선','시흥센터 → 가산 → 반대 방향 → 집'],['doksan1','독산역 · 1호선','시흥센터 → 독산 → 반대 방향 → 집']]};const fmt=v=>v?new Date(v).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'-';const fresh=x=>x?.realtime_usable===true?'<span class="status fresh">LIVE · fresh</span>':'<span class="status stale">STALE/UNUSABLE</span>';
function arrivalClock(x,p){if(x.expected_arrival_at)return[fmt(x.expected_arrival_at),'API 제공 시각'];const sec=Number(x.first_seconds),base=Date.parse(p.requested_at||p.updated_at);return Number.isFinite(sec)&&sec>=0&&Number.isFinite(base)?[fmt(base+sec*1000),'requested_at + first_seconds 계산']:null}
function renderBus(){const p=state.bus;if(!p)return;const expected=String(p.official_stop_name||'').trim();const list=(p.arrivals||[]).filter(x=>!expected||String(x.destination||'').trim()===expected).filter(x=>x.route_targets?.includes(state.route)&&x.journey_directions?.includes(state.direction));$('#bus-title').textContent=`${state.route==='gasan7'?'가산역':'독산역'} 방향 버스 · ${state.direction==='outbound'?'집 → 시흥':'시흥 → 집'}`;$('#bus-summary').textContent=list.length?`검증된 방향 일치 버스 ${list.length}건`:'검증된 정류장→경로 방향 mapping이 없어 버스를 추천하지 않습니다.';$('#bus-diag').textContent=`ARS ${p.ars_id||'-'} · stId ${p.expected_st_id||'-'} · source ${p.source||'-'} · identity와 route direction이 모두 검증된 행만 표시`;$('#bus-arrivals').innerHTML=list.map(x=>{const a=arrivalClock(x,p);return `<div class="row"><b>${esc(x.route)}</b><span>${esc(x.first_message)}${a?` (${a[0]})`:''}</span><span class="diagnostic">${a?esc(a[1]):'도착시각 산출 근거 없음'}</span></div>`}).join('')}
function render(){const out=state.direction==='outbound';$('#direction-title').textContent=out?'집 → 시흥':'시흥 → 집';document.querySelectorAll('[data-direction]').forEach(b=>b.classList.toggle('active',b.dataset.direction===state.direction));$('#routes').innerHTML=ROUTES[state.direction].map(r=>`<div class="route"><h3>${r[1]}</h3><div class="detail">${r[2]}</div><button class="route-button ${state.route===r[0]?'active':''}" data-route="${r[0]}">이 경로 선택</button></div>`).join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{state.route=b.dataset.route;render()});$('#line7-title').textContent=`가산디지털단지역 · ${out?'석남':'반대'} 방향`;$('#line1-title').textContent=`독산역 · ${out?'구로':'반대'} 방향`;const usable=state.route==='gasan7'?state.line7?.realtime_usable===true:(out&&state.line1?.realtime_usable===true);$('#decision-title').textContent=usable?'realtime 사용 가능':'realtime 배제 · fallback 필요';$('#decision').innerHTML=usable?`선택 경로 <b>${state.route==='gasan7'?'가산 7호선':'독산 1호선'}</b> · fresh 데이터만 rolling ETA와 deadline 판단에 사용${state.runtime?.ranked?.[0]?`<br>부분 ETA ${fmt(state.runtime.ranked[0].final_eta)} · deadline ${esc(state.runtime.ranked[0].deadline_state)}`:''}`:'fresh 실시간 데이터가 없습니다. LIVE·ETA·plan_deviation·추천 근거로 사용하지 않으며 검증된 schedule/plan fallback만 허용합니다.';renderBus()}
document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{state.direction=b.dataset.direction;state.route='gasan7';render()});
fetch('./data/subway.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(p=>{state.line7=p;$('#line7-summary').innerHTML=`${fresh(p)} · fresh ${p.fresh_arrival_count||0}/${p.total_arrivals||0}`;$('#line7-diag').textContent=`조회시각 ${p.requested_at||'-'} · threshold ${p.freshness_threshold_seconds}s`;$('#line7-arrivals').innerHTML=(p.arrivals||[]).map(x=>`<div class="row"><b>${esc(x.destination)}</b><span>${esc(x.arrival_message)}</span><span class="diagnostic">observed_at ${x.observed_at||'-'} · age_seconds ${x.age_seconds??'-'} · ${x.freshness||'-'}</span></div>`).join('');render()}).catch(e=>{$('#line7-summary').textContent='Vercel realtime 실패 — snapshot fallback 금지';$('#line7-diag').textContent=e.message});
fetch('./data/doksan-line1.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(p=>{state.line1=p;const rows=(p.rows||[]).filter(x=>x.realtime_usable===true);$('#line1-summary').innerHTML=`${fresh(p)} · fresh ${rows.length}/${p.total_arrivals||0}`;$('#line1-diag').textContent=`requested_at ${p.requested_at||'-'} · threshold ${p.freshness_threshold_seconds}s`;$('#line1-arrivals').innerHTML=rows.map(x=>`<div class="row"><b>${esc(x.bstatnNm)}</b><span>${esc(x.arvlMsg2)}</span><span class="diagnostic">observed_at ${x.observed_at||x.recptnDt||'-'} · age_seconds ${x.age_seconds??'-'} · ${x.freshness}</span></div>`).join('');render()}).catch(e=>{$('#line1-summary').textContent='1호선 freshness 데이터 없음';$('#line1-diag').textContent=e.message});
fetch('./data/phase2-runtime.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(p=>{state.runtime=p;render()}).catch(()=>{});fetch('./data/bus.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(p=>{state.bus=p;renderBus()}).catch(e=>{$('#bus-diag').textContent=e.message});render();
</script></body></html>
