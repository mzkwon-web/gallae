name: Deploy Gallae with live transit data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily, roughly 05:20–23:50 KST, every 10 minutes.
    - cron: '20-50/10 20-23 * * *'
    - cron: '*/10 0-14 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live transit data
        env:
          SEOUL_SUBWAY_API_KEY: ${{ secrets.SEOUL_SUBWAY_API_KEY }}
          DATA_GO_KR_BUS_API_KEY: ${{ secrets.DATA_GO_KR_BUS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          kst = timezone(timedelta(hours=9))
          now = datetime.now(kst).isoformat(timespec='seconds')
          Path('data').mkdir(exist_ok=True)

          # Subway: Gasan Digital Complex Station, Line 7
          subway_key = os.environ.get('SEOUL_SUBWAY_API_KEY')
          subway_payload = {'status':'error','station':'가산디지털단지','line':'7호선','updated_at':now,'arrivals':[]}
          if subway_key:
              try:
                  station = urllib.parse.quote('가산디지털단지')
                  url = f'http://swopenapi.seoul.go.kr/api/subway/{subway_key}/json/realtimeStationArrival/0/30/{station}'
                  req = urllib.request.Request(url, headers={'User-Agent':'gallae-poc/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = json.loads(response.read().decode('utf-8'))
                  rows = raw.get('realtimeArrivalList', [])
                  arrivals = []
                  for row in rows:
                      if str(row.get('subwayId')) == '1007':
                          arrivals.append({
                              'destination': row.get('bstatnNm'),
                              'direction': row.get('updnLine'),
                              'train_line': row.get('trainLineNm'),
                              'arrival_message': row.get('arvlMsg2'),
                              'current_location': row.get('arvlMsg3'),
                              'train_no': row.get('btrainNo'),
                              'received_at': row.get('recptnDt'),
                          })
                  subway_payload.update(status='ok', arrivals=arrivals[:8])
              except Exception as e:
                  subway_payload['error'] = str(e)
          else:
              subway_payload['error'] = 'SEOUL_SUBWAY_API_KEY is missing'
          Path('data/subway.json').write_text(json.dumps(subway_payload, ensure_ascii=False, indent=2), encoding='utf-8')

          # Bus: TAGO bus-arrival API
          bus_key = os.environ.get('DATA_GO_KR_BUS_API_KEY')
          bus_payload = {
              'status':'error', 'stop_name':'롯데캐슬 정류장', 'ars_id':'18514',
              'updated_at':now, 'arrivals':[]
          }

          def safe_http_error(err):
              try:
                  body = err.read().decode('utf-8', errors='replace').strip()
              except Exception:
                  body = ''
              # Never expose request URLs or secret values. Keep only server error body.
              if len(body) > 600:
                  body = body[:600]
              return f'HTTP {err.code}: {body or err.reason}'

          def call_tago(key, node_id):
              # Official data.go.kr service URL is HTTP.
              base = 'http://apis.data.go.kr/1613000/ArvlInfoInqireService/getSttnAcctoArvlPrearngeInfoList'
              decoded_key = urllib.parse.unquote(key.strip())
              # Encode exactly once for query transport.
              query = (
                  'serviceKey=' + urllib.parse.quote(decoded_key, safe='') +
                  '&pageNo=1&numOfRows=30&_type=json&cityCode=11&nodeId=' + urllib.parse.quote(node_id, safe='')
              )
              req = urllib.request.Request(base + '?' + query, headers={'User-Agent':'Mozilla/5.0 gallae-poc/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      text = response.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  raise RuntimeError(safe_http_error(e))
              try:
                  return json.loads(text)
              except Exception:
                  raise RuntimeError('Non-JSON response: ' + text[:400])

          if bus_key:
              errors = []
              node_candidates = ['SEOUL117900129', '117900129', 'SEOUL18514', '18514']
              for node_id in node_candidates:
                  try:
                      raw = call_tago(bus_key, node_id)
                      response = raw.get('response', {})
                      header = response.get('header', {})
                      if str(header.get('resultCode')) != '00':
                          raise RuntimeError(f"TAGO {header.get('resultCode')}: {header.get('resultMsg')}")
                      body = response.get('body', {}) or {}
                      items_obj = body.get('items') or {}
                      items = items_obj.get('item') if isinstance(items_obj, dict) else []
                      items = items or []
                      if isinstance(items, dict):
                          items = [items]
                      if not items:
                          errors.append(f'{node_id}: no data')
                          continue
                      arrivals = []
                      for item in items:
                          seconds = item.get('arrtime')
                          try:
                              mins = max(0, round(int(seconds) / 60))
                              first_msg = f'{mins}분 후' if mins > 0 else '곧 도착'
                          except Exception:
                              first_msg = str(seconds or '도착정보 확인 중')
                          stops = item.get('arrprevstationcnt')
                          arrivals.append({
                              'route': item.get('routeno'),
                              'first_message': first_msg,
                              'first_seconds': seconds,
                              'first_stops': stops,
                              'second_message': f'{stops}정류장 전' if stops not in (None, '') else '',
                              'vehicle_type': item.get('vehicletp'),
                              'destination': item.get('nodenm'),
                          })
                      bus_payload.update(status='ok', node_id=node_id, arrivals=arrivals)
                      break
                  except Exception as e:
                      errors.append(f'{node_id}: {e}')
              if bus_payload['status'] != 'ok':
                  bus_payload['error'] = ' | '.join(errors)
          else:
              bus_payload['error'] = 'DATA_GO_KR_BUS_API_KEY is missing'

          Path('data/bus.json').write_text(json.dumps(bus_payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
