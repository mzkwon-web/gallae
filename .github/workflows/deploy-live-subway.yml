name: Deploy Gallae with live transit data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live transit data
        env:
          SEOUL_SUBWAY_API_KEY: ${{ secrets.SEOUL_SUBWAY_API_KEY }}
          DATA_GO_KR_BUS_API_KEY: ${{ secrets.DATA_GO_KR_BUS_API_KEY }}
          GYEONGGI_BUS_API_KEY: ${{ secrets.DATA_GO_KR_BUS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          kst = timezone(timedelta(hours=9))
          started_at = datetime.now(kst)
          now = started_at.isoformat(timespec='seconds')
          Path('data').mkdir(exist_ok=True)

          def fetch_bytes(url, timeout=25, attempts=3):
              last = None
              for i in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 gallae-poc/1.0'})
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return response.read()
                  except Exception as e:
                      last = e
                      if i < attempts - 1:
                          time.sleep(2 * (i + 1))
              raise last

          # Subway: Gasan Digital Complex, Line 7
          subway_key = os.environ.get('SEOUL_SUBWAY_API_KEY')
          subway_payload = {'status':'error','station':'가산디지털단지','line':'7호선','updated_at':now,'arrivals':[]}
          if subway_key:
              try:
                  station = urllib.parse.quote('가산디지털단지')
                  url = f'http://swopenapi.seoul.go.kr/api/subway/{subway_key}/json/realtimeStationArrival/0/30/{station}'
                  raw = json.loads(fetch_bytes(url, timeout=20, attempts=3).decode('utf-8'))
                  rows = raw.get('realtimeArrivalList', [])
                  arrivals = []
                  for row in rows:
                      if str(row.get('subwayId')) == '1007':
                          arrivals.append({
                              'destination': row.get('bstatnNm'),
                              'direction': row.get('updnLine'),
                              'train_line': row.get('trainLineNm'),
                              'arrival_message': row.get('arvlMsg2'),
                              'current_location': row.get('arvlMsg3'),
                              'train_no': row.get('btrainNo'),
                              'received_at': row.get('recptnDt'),
                          })
                  subway_payload.update(status='ok', arrivals=arrivals[:8])
              except Exception as e:
                  subway_payload['error'] = str(e)
          else:
              subway_payload['error'] = 'SEOUL_SUBWAY_API_KEY is missing'
          Path('data/subway.json').write_text(json.dumps(subway_payload, ensure_ascii=False, indent=2), encoding='utf-8')

          # TAGO helpers
          bus_key = os.environ.get('DATA_GO_KR_BUS_API_KEY')
          TAGO_BASE = 'https://apis.data.go.kr/1613000'

          def tago(path, params=None):
              params = params or {}
              query = {
                  'serviceKey': urllib.parse.unquote((bus_key or '').strip()),
                  '_type': 'json',
                  'pageNo': '1',
                  'numOfRows': '100',
                  **{k: str(v) for k, v in params.items()}
              }
              url = TAGO_BASE + '/' + path + '?' + urllib.parse.urlencode(query, safe='%')
              try:
                  text = fetch_bytes(url, timeout=45, attempts=3).decode('utf-8', errors='replace')
              except Exception as e:
                  raise RuntimeError(f'TAGO request failed [{path}]: {e}') from e
              try:
                  raw = json.loads(text)
              except Exception:
                  raise RuntimeError('TAGO non-JSON response [' + path + ']: ' + text[:300])
              response = raw.get('response', {}) if isinstance(raw, dict) else {}
              header = response.get('header', {}) if isinstance(response, dict) else {}
              code = str(header.get('resultCode', ''))
              msg = header.get('resultMsg') or ''
              if code not in ('00', '0', ''):
                  raise RuntimeError(f'TAGO {code} [{path}]: {msg}')
              body = response.get('body', {}) or {}
              items_obj = body.get('items') or {}
              items = items_obj.get('item') if isinstance(items_obj, dict) else []
              if items is None:
                  items = []
              if isinstance(items, dict):
                  items = [items]
              return items, body

          def find_city_code(keyword='서울'):
              items, _ = tago('BusSttnInfoInqireService/getCtyCodeList')
              if not items:
                  raise RuntimeError('TAGO getCtyCodeList returned no cities')

              sample = items[0]
              print('TAGO getCtyCodeList sample item:', json.dumps(sample, ensure_ascii=False))

              found = None
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  if any(isinstance(value, str) and keyword in value for value in item.values()):
                      found = item
                      break

              if not found:
                  raise RuntimeError(
                      f"TAGO cityCode not found for {keyword}; received {len(items)} cities; "
                      f"sample={json.dumps(sample, ensure_ascii=False)[:500]}"
                  )

              code_keys = [key for key in found.keys() if 'code' in key.lower()]
              for key in code_keys:
                  value = found.get(key)
                  if value not in (None, ''):
                      print('TAGO city match:', json.dumps(found, ensure_ascii=False), 'codeKey=', key)
                      return str(value)

              raise RuntimeError(
                  'TAGO city matched but no code-like field found: ' +
                  json.dumps(found, ensure_ascii=False)[:500]
              )

          def find_node_by_ars(city_code, ars_id):
              items, body = tago('BusSttnInfoInqireService/getSttnNoList', {
                  'cityCode': city_code,
                  'nodeNo': ars_id,
              })
              if not items:
                  total = body.get('totalCount')
                  raise RuntimeError(f'TAGO station lookup returned no data for ARS {ars_id} (cityCode={city_code}, totalCount={total})')
              exact = None
              for item in items:
                  no = str(item.get('nodeno') or item.get('nodeNo') or '')
                  if no == str(ars_id):
                      exact = item
                      break
              chosen = exact or items[0]
              node_id = chosen.get('nodeid') or chosen.get('nodeId')
              if not node_id:
                  raise RuntimeError('TAGO station lookup returned item without nodeId: ' + json.dumps(chosen, ensure_ascii=False)[:350])
              return str(node_id), chosen

          def get_tago_arrivals(city_code, node_id):
              items, _ = tago('ArvlInfoInqireService/getSttnAcctoArvlPrearngeInfoList', {
                  'cityCode': city_code,
                  'nodeId': node_id,
              })
              arrivals = []
              for item in items:
                  sec = item.get('arrtime')
                  try:
                      sec_i = int(sec)
                      mins = max(0, round(sec_i / 60))
                      first_message = f'{mins}분 후' if mins > 0 else '곧 도착'
                  except Exception:
                      sec_i = sec
                      first_message = str(sec or '도착정보 확인 중')
                  stops = item.get('arrprevstationcnt')
                  arrivals.append({
                      'route': item.get('routeno') or item.get('routeid'),
                      'first_message': first_message,
                      'first_seconds': sec_i,
                      'first_stops': stops,
                      'second_message': f'{stops}정류장 전' if stops not in (None, '') else '',
                      'destination': item.get('nodenm') or '',
                      'source': 'tago',
                  })
              return arrivals

          def probe_gyeonggi(station_id='200000078'):
              key = os.environ.get('GYEONGGI_BUS_API_KEY')
              if not key:
                  raise RuntimeError('GYEONGGI_BUS_API_KEY is missing')
              base = 'https://apis.data.go.kr/6410000/busarrivalservice/v2/getBusArrivalListv2'
              query = urllib.parse.urlencode({
                  'format': 'json',
                  'serviceKey': urllib.parse.unquote(key.strip()),
                  'stationId': station_id,
              }, safe='%')
              raw = json.loads(fetch_bytes(base + '?' + query, timeout=25, attempts=2).decode('utf-8', errors='replace'))
              response = raw.get('response', {}) if isinstance(raw, dict) else {}
              header = response.get('msgHeader', {}) if isinstance(response, dict) else {}
              code = str(header.get('resultCode', ''))
              msg = header.get('resultMessage') or header.get('resultMsg') or ''
              if code not in ('0', '00'):
                  raise RuntimeError(f'GYEONGGI {code}: {msg}')
              body = response.get('msgBody', {}) if isinstance(response, dict) else {}
              items = body.get('busArrivalList', []) if isinstance(body, dict) else []
              if isinstance(items, dict):
                  items = [items]
              return len(items or [])

          bus_payload = {
              'status':'error', 'source':'tago', 'stop_name':'롯데캐슬 정류장',
              'ars_id':'18514', 'updated_at':now, 'arrivals':[], 'stage':'not_started'
          }
          if not bus_key:
              bus_payload.update(stage='auth', error='DATA_GO_KR_BUS_API_KEY is missing')
          else:
              try:
                  bus_payload['stage'] = 'city_code_lookup'
                  city_code = find_city_code('서울')
                  bus_payload['city_code'] = city_code

                  bus_payload['stage'] = 'ars_to_node_lookup'
                  node_id, station = find_node_by_ars(city_code, '18514')
                  bus_payload['node_id'] = node_id

                  bus_payload['stage'] = 'arrival_lookup'
                  arrivals = get_tago_arrivals(city_code, node_id)
                  bus_payload.update(
                      status='ok', stage='complete',
                      official_stop_name=station.get('nodenm') or station.get('nodeNm'),
                      arrivals=arrivals
                  )
              except Exception as e:
                  bus_payload['error'] = str(e)
          Path('data/bus.json').write_text(json.dumps(bus_payload, ensure_ascii=False, indent=2), encoding='utf-8')

          source_checks = {
              'seoul': {
                  'status': bus_payload.get('status'),
                  'source': 'tago',
                  'stage': bus_payload.get('stage'),
                  'error': bus_payload.get('error'),
              },
              'gyeonggi': {
                  'status': 'error',
                  'source': 'gyeonggi_bus_api',
                  'test_station_id': '200000078',
                  'error': None,
              },
          }
          try:
              gy_count = probe_gyeonggi()
              source_checks['gyeonggi'].update(status='ok', arrival_count=gy_count)
          except Exception as e:
              source_checks['gyeonggi']['error'] = str(e)

          finished_at = datetime.now(kst)
          checks_ok = all(v.get('status') == 'ok' for v in source_checks.values())
          overall = 'ok' if subway_payload.get('status') == 'ok' and bus_payload.get('status') == 'ok' and checks_ok else 'degraded'
          last_run = {
              'status': 'ok' if bus_payload.get('status') == 'ok' else 'error',
              'overall_status': overall,
              'started_at': started_at.isoformat(timespec='seconds'),
              'finished_at': finished_at.isoformat(timespec='seconds'),
              'duration_seconds': round((finished_at - started_at).total_seconds(), 2),
              'subway': {
                  'status': subway_payload.get('status'),
                  'arrival_count': len(subway_payload.get('arrivals') or []),
                  'error': subway_payload.get('error'),
              },
              'bus': {
                  'status': bus_payload.get('status'),
                  'source': bus_payload.get('source'),
                  'stage': bus_payload.get('stage'),
                  'city_code': bus_payload.get('city_code'),
                  'node_id': bus_payload.get('node_id'),
                  'arrival_count': len(bus_payload.get('arrivals') or []),
                  'error': bus_payload.get('error'),
              },
              'source_checks': source_checks,
          }
          Path('data/last-run.json').write_text(json.dumps(last_run, ensure_ascii=False, indent=2), encoding='utf-8')

          if bus_payload.get('status') != 'ok':
              raise SystemExit('TAGO bus integration failed at ' + str(bus_payload.get('stage')) + ': ' + str(bus_payload.get('error')))
          PY

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
