name: Deploy Gallae with live transit data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live transit data
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SEOUL_SUBWAY_API_KEY: ${{ secrets.SEOUL_SUBWAY_API_KEY }}
          GYEONGGI_BUS_API_KEY: ${{ secrets.GYEONGGI_BUS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          kst = timezone(timedelta(hours=9))
          started_at = datetime.now(kst)
          now = started_at.isoformat(timespec='seconds')
          Path('data').mkdir(exist_ok=True)

          def fetch_bytes(url, timeout=20, attempts=3):
              last = None
              for i in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 gallae-poc/1.0'})
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return response.read()
                  except Exception as e:
                      last = e
                      if i < attempts - 1:
                          time.sleep(2 * (i + 1))
              raise last

          def secret_param(value):
              return urllib.parse.quote(urllib.parse.unquote((value or '').strip()), safe='')

          subway_key = os.environ.get('SEOUL_SUBWAY_API_KEY')
          subway_payload = {'status':'error','station':'가산디지털단지','line':'7호선','updated_at':now,'arrivals':[]}
          if subway_key:
              try:
                  station = urllib.parse.quote('가산디지털단지')
                  url = f'http://swopenapi.seoul.go.kr/api/subway/{subway_key}/json/realtimeStationArrival/0/30/{station}'
                  raw = json.loads(fetch_bytes(url, timeout=20, attempts=3).decode('utf-8'))
                  rows = raw.get('realtimeArrivalList', [])
                  arrivals = []
                  for row in rows:
                      if str(row.get('subwayId')) == '1007':
                          arrivals.append({
                              'destination': row.get('bstatnNm'),
                              'direction': row.get('updnLine'),
                              'train_line': row.get('trainLineNm'),
                              'arrival_message': row.get('arvlMsg2'),
                              'current_location': row.get('arvlMsg3'),
                              'train_no': row.get('btrainNo'),
                              'received_at': row.get('recptnDt'),
                          })
                  subway_payload.update(status='ok', arrivals=arrivals[:8])
              except Exception as e:
                  subway_payload['error'] = str(e)
          else:
              subway_payload['error'] = 'SEOUL_SUBWAY_API_KEY is missing'
          Path('data/subway.json').write_text(json.dumps(subway_payload, ensure_ascii=False, indent=2), encoding='utf-8')

          def bus_record(route, seconds=None, stops=None, second_message='', destination=''):
              try:
                  sec = int(seconds)
                  mins = max(0, round(sec / 60))
                  msg = f'{mins}분 후' if mins > 0 else '곧 도착'
              except Exception:
                  sec = seconds
                  msg = str(seconds or '도착정보 확인 중')
              return {
                  'route': route,
                  'first_message': msg,
                  'first_seconds': sec,
                  'first_stops': stops,
                  'second_message': second_message or (f'{stops}정류장 전' if stops not in (None, '') else ''),
                  'destination': destination,
              }

          def fetch_seoul_bus(ars_id):
              key = os.environ.get('SEOUL_API_KEY')
              if not key:
                  raise RuntimeError('SEOUL_API_KEY is missing')
              base = 'http://ws.bus.go.kr/api/rest/stationinfo/getStationByUid'
              url = base + '?serviceKey=' + secret_param(key) + '&arsId=' + urllib.parse.quote(ars_id)
              xml_bytes = fetch_bytes(url, timeout=25, attempts=2)
              root = ET.fromstring(xml_bytes)
              header_cd = (root.findtext('.//headerCd') or '').strip()
              header_msg = (root.findtext('.//headerMsg') or '').strip()
              if header_cd not in ('0','00',''):
                  raise RuntimeError(f'SEOUL {header_cd}: {header_msg}')
              out = []
              for item in root.findall('.//itemList'):
                  def t(name):
                      v = item.findtext(name)
                      return v.strip() if isinstance(v, str) else v
                  out.append(bus_record(
                      route=t('rtNm') or t('busRouteAbrv') or t('busRouteNm'),
                      seconds=t('traTime1'),
                      stops=t('sectOrd1'),
                      second_message=t('arrmsg2') or '',
                      destination=t('stNm') or '',
                  ))
              return out

          def fetch_gyeonggi_bus(station_id):
              key = os.environ.get('GYEONGGI_BUS_API_KEY')
              if not key:
                  raise RuntimeError('GYEONGGI_BUS_API_KEY is missing')
              base = 'https://apis.data.go.kr/6410000/busarrivalservice/v2/getBusArrivalListv2'
              url = (base + '?format=json&serviceKey=' + secret_param(key) +
                     '&stationId=' + urllib.parse.quote(str(station_id)))
              raw = json.loads(fetch_bytes(url, timeout=25, attempts=2).decode('utf-8', errors='replace'))
              response = raw.get('response', {}) if isinstance(raw, dict) else {}
              msg_header = response.get('msgHeader', {}) if isinstance(response, dict) else {}
              result_code = str(msg_header.get('resultCode', ''))
              result_message = msg_header.get('resultMessage') or msg_header.get('resultMsg') or ''
              if result_code not in ('0','00'):
                  raise RuntimeError(f'GYEONGGI {result_code}: {result_message}')
              body = response.get('msgBody', {}) if isinstance(response, dict) else {}
              items = body.get('busArrivalList', []) if isinstance(body, dict) else []
              if isinstance(items, dict):
                  items = [items]
              out = []
              for item in items or []:
                  out.append(bus_record(
                      route=item.get('routeName') or item.get('routeId'),
                      seconds=item.get('predictTimeSec1'),
                      stops=item.get('locationNo1'),
                      second_message=(f"다음 차량 {item.get('predictTime2')}분 후" if item.get('predictTime2') not in (None,'') else ''),
                      destination=item.get('stationNm1') or '',
                  ))
              return out

          bus_payload = {
              'status':'error', 'source':'seoul', 'stop_name':'롯데캐슬 정류장',
              'ars_id':'18514', 'updated_at':now, 'arrivals':[]
          }
          try:
              bus_payload.update(status='ok', arrivals=fetch_seoul_bus('18514'))
          except Exception as e:
              bus_payload['error'] = str(e)
          Path('data/bus.json').write_text(json.dumps(bus_payload, ensure_ascii=False, indent=2), encoding='utf-8')

          source_checks = {
              'seoul': {'status': bus_payload.get('status'), 'error': bus_payload.get('error')},
              'gyeonggi': {'status':'error', 'test_station_id':'200000078'},
          }
          try:
              gy_probe = fetch_gyeonggi_bus('200000078')
              source_checks['gyeonggi'].update(status='ok', arrival_count=len(gy_probe))
          except Exception as e:
              source_checks['gyeonggi']['error'] = str(e)

          finished_at = datetime.now(kst)
          overall = 'ok' if subway_payload.get('status') == 'ok' and bus_payload.get('status') == 'ok' else 'degraded'
          last_run = {
              'overall_status': overall,
              'started_at': started_at.isoformat(timespec='seconds'),
              'finished_at': finished_at.isoformat(timespec='seconds'),
              'duration_seconds': round((finished_at - started_at).total_seconds(), 2),
              'subway': {
                  'status': subway_payload.get('status'),
                  'arrival_count': len(subway_payload.get('arrivals') or []),
                  'error': subway_payload.get('error'),
              },
              'bus': {
                  'status': bus_payload.get('status'),
                  'source': bus_payload.get('source'),
                  'arrival_count': len(bus_payload.get('arrivals') or []),
                  'error': bus_payload.get('error'),
              },
              'source_checks': source_checks,
          }
          Path('data/last-run.json').write_text(json.dumps(last_run, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
