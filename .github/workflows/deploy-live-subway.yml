name: Deploy Gallae with live transit data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live transit data
        env:
          SEOUL_SUBWAY_API_KEY: ${{ secrets.SEOUL_SUBWAY_API_KEY }}
          DATA_GO_KR_BUS_API_KEY: ${{ secrets.DATA_GO_KR_BUS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          kst=timezone(timedelta(hours=9)); started=datetime.now(kst); now=started.isoformat(timespec='seconds')
          Path('data').mkdir(exist_ok=True)
          def fetch_bytes(url,timeout=25,attempts=3):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 gallae-field-test/0.1'})
                      with urllib.request.urlopen(req,timeout=timeout) as r: return r.read()
                  except Exception as e:
                      last=e; time.sleep(2*(i+1)) if i<attempts-1 else None
              raise last
          def norm(v): return urllib.parse.unquote((v or '').strip())
          def write(path,payload): Path(path).write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          subway_key=(os.environ.get('SEOUL_SUBWAY_API_KEY') or '').strip()
          bus_key=(os.environ.get('DATA_GO_KR_BUS_API_KEY') or '').strip()
          threshold=60

          def parse_dt(v):
              try: return datetime.strptime(v,'%Y-%m-%d %H:%M:%S').replace(tzinfo=kst)
              except Exception: return None
          def add_fresh(item, observed, requested):
              od=parse_dt(observed); age=None if not od else max(0,round((requested-od).total_seconds()))
              item.update(observed_at=observed,age=age,age_seconds=age,freshness='fresh' if age is not None and age<=threshold else 'stale',realtime_usable=age is not None and age<=threshold)
              return item

          def fetch_subway(station,line_id,path,row_filter=lambda r: True):
              payload={'status':'error','station':station,'updated_at':now,'requested_at':now,'freshness_threshold_seconds':threshold,'arrivals':[],'rows':[]}
              if not subway_key:
                  payload['error']='SEOUL_SUBWAY_API_KEY is missing'; write(path,payload); return payload
              try:
                  url=f"http://swopenapi.seoul.go.kr/api/subway/{subway_key}/json/realtimeStationArrival/0/50/{urllib.parse.quote(station)}"
                  raw=json.loads(fetch_bytes(url,20,3).decode('utf-8'))
                  requested=datetime.now(kst); rows=[]
                  for r in raw.get('realtimeArrivalList') or []:
                      if str(r.get('subwayId'))!=line_id or not row_filter(r): continue
                      item={k:r.get(k) for k in ['subwayId','updnLine','bstatnNm','trainLineNm','btrainNo','btrainSttus','barvlDt','arvlMsg2','arvlMsg3','arvlCd','subwayHeading','recptnDt','statnFid','statnTid','statnId','statnNm','ordkey'] if k in r}
                      item.update(destination=r.get('bstatnNm'),direction=r.get('updnLine'),train_line=r.get('trainLineNm'),arrival_message=r.get('arvlMsg2'),current_location=r.get('arvlMsg3'),train_no=r.get('btrainNo'),arrival_seconds=r.get('barvlDt'))
                      rows.append(add_fresh(item,r.get('recptnDt'),requested))
                  payload.update(status='ok',requested_at=requested.isoformat(timespec='seconds'),arrivals=rows[:8],rows=rows,row_count=len(rows),total_arrivals=len(rows),fresh_arrival_count=sum(1 for x in rows if x.get('realtime_usable')),realtime_usable=any(x.get('realtime_usable') for x in rows))
              except Exception as e: payload['error']=str(e)
              write(path,payload); return payload

          subway=fetch_subway('가산디지털단지','1007','data/subway.json')
          doksan=fetch_subway('독산','1001','data/doksan-line1.json')

          def fetch_bus_stop(ars_id, route_name, direction, target, evidence, verified=False):
              payload={'status':'error','source':'seoul-data-go-kr','ars_id':ars_id,'route':route_name,'updated_at':now,'arrivals':[],'identity_diagnostics':[],'stage':'arrival_lookup','mapping_status':'verified' if verified else 'user_experience','verification_required':not verified}
              if not bus_key:
                  payload['error']='DATA_GO_KR_BUS_API_KEY is missing'; return payload
              try:
                  base='http://ws.bus.go.kr/api/rest/stationinfo/getStationByUid'
                  q=urllib.parse.urlencode({'serviceKey':norm(bus_key),'arsId':ars_id},safe='%')
                  root=ET.fromstring(fetch_bytes(base+'?'+q,30,3))
                  cd=(root.findtext('.//headerCd') or '').strip(); msg=(root.findtext('.//headerMsg') or '').strip()
                  if cd not in ('0','00',''): raise RuntimeError(f'SEOUL {cd}: {msg}')
                  rows=[]
                  for item in root.findall('.//itemList'):
                      def t(n):
                          v=item.findtext(n); return v.strip() if isinstance(v,str) else v
                      r={n:t(n) for n in ['arsId','stId','stNm','busRouteId','rtNm','busRouteAbrv','busRouteNm','arrmsg1','traTime1','sectOrd1','arrmsg2','traTime2','sectOrd2']}
                      rows.append(r)
                  matched=[r for r in rows if (r.get('rtNm') or r.get('busRouteAbrv') or r.get('busRouteNm') or '').replace(' ','')==route_name.replace(' ','')]
                  if not matched: raise RuntimeError(f'No {route_name} rows at arsId={ars_id}')
                  arrivals=[]
                  for r in matched:
                      arrivals.append({'ars_id':r.get('arsId'),'st_id':r.get('stId'),'bus_route_id':r.get('busRouteId'),'route':r.get('rtNm') or r.get('busRouteAbrv') or r.get('busRouteNm'),'first_message':r.get('arrmsg1') or '도착정보 확인 중','first_seconds':r.get('traTime1'),'first_stops':r.get('sectOrd1'),'second_message':r.get('arrmsg2') or '','second_seconds':r.get('traTime2'),'second_stops':r.get('sectOrd2'),'destination':r.get('stNm') or '','source':'seoul-data-go-kr','route_targets':[target],'journey_directions':[direction],'mapping_source':'seoul_official_route_stop_order_20260804' if verified else 'user_experience_pending_official_route_order','mapping_status':'verified' if verified else 'user_experience','verification_required':not verified,'boarding_ars_id':ars_id,'mapping_evidence':evidence})
                  payload.update(status='ok',stage='complete',arrivals=arrivals,identity_diagnostics=[{k:r.get(k) for k in ('arsId','stId','busRouteId','rtNm','stNm')} for r in rows],row_count=len(rows))
              except Exception as e: payload['error']=str(e)
              return payload

          inbound=fetch_bus_stop('18603','금천07','inbound','gasan7','서울시 공식 노선별 정류소 자료: 가산디지털단지역3번출구(35)에서 금천현대아파트.청소년문화의집(41) 순방향',True)
          outbound=fetch_bus_stop('18514','금천07','outbound','gasan7','사용자 제공 이동경험 근거: 집 인근 18514에서 금천07 탑승 후 가산디지털단지역 접근. 공식 노선·정류장 순서 검증은 후속 필요.',False)
          bus=dict(inbound); bus.update({'directions':{'inbound':inbound,'outbound':outbound},'status':'ok' if inbound.get('status')=='ok' or outbound.get('status')=='ok' else 'error'})
          write('data/bus.json',bus)
          finished=datetime.now(kst)
          write('data/last-run.json',{'status':'ok','overall_status':'ok' if subway.get('status')=='ok' and doksan.get('status')=='ok' else 'degraded','started_at':started.isoformat(timespec='seconds'),'finished_at':finished.isoformat(timespec='seconds'),'duration_seconds':round((finished-started).total_seconds(),2),'subway':{'status':subway.get('status'),'arrival_count':len(subway.get('arrivals') or []),'error':subway.get('error')},'doksan_line1':{'status':doksan.get('status'),'row_count':len(doksan.get('rows') or []),'error':doksan.get('error'),'sample_rows':doksan.get('rows') or []},'bus':{'inbound':{'status':inbound.get('status'),'arrival_count':len(inbound.get('arrivals') or []),'error':inbound.get('error')},'outbound':{'status':outbound.get('status'),'arrival_count':len(outbound.get('arrivals') or []),'error':outbound.get('error')}}})
          if bus.get('status')!='ok': raise SystemExit('Bus integration failed')
          PY

      - name: Build phase 2 hybrid runtime
        if: always()
        run: node scripts/build-phase2-runtime.js data/doksan-line1.json data/phase2-runtime.json

      - name: Verify deploy payload
        if: always()
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          kst=timezone(timedelta(hours=9))
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          checks={}; errors=[]
          app=Path('app.html').read_text(encoding='utf-8')
          for name,path in [('subway_json','data/subway.json'),('doksan_line1_json','data/doksan-line1.json'),('bus_json','data/bus.json'),('last_run_json','data/last-run.json')]:
              try:
                  data=load(path); checks[name]='ok' if data.get('status') in ('ok','degraded') else 'error'
                  if checks[name]!='ok': errors.append(f'{path}: {data.get("error")}')
              except Exception as e: checks[name]='error'; errors.append(f'{path}: {e}')
          try:
              bus=load('data/bus.json'); out=bus.get('directions',{}).get('outbound',{}); inn=bus.get('directions',{}).get('inbound',{})
              checks['bus_outbound_18514']='ok' if out.get('ars_id')=='18514' and out.get('status')=='ok' and out.get('arrivals') else 'error'
              checks['bus_inbound_18603']='ok' if inn.get('ars_id')=='18603' and inn.get('status')=='ok' and inn.get('arrivals') else 'error'
              if checks['bus_outbound_18514']!='ok': errors.append('outbound 18514 Geumcheon07 realtime missing')
          except Exception as e: checks['bus_outbound_18514']=checks['bus_inbound_18603']='error'; errors.append(str(e))
          checks['source_renderer']='ok' if './lib/source-types.js' in app and 'GallaeSourceTypes?.LABELS' in app else 'error'
          checks['bus_ui_identity_filter']='ok' if 'official_stop_name' in app and '.filter(x=>!expected' in app else 'error'
          checks['bus_ui_realtime']='ok' if 'busArrivalText' in app and '금천07 실시간' in app else 'error'
          status='ok' if all(v=='ok' for v in checks.values()) else 'error'
          payload={'status':status,'verified_at':datetime.now(kst).isoformat(timespec='seconds'),'build_commit':os.environ.get('BUILD_COMMIT'),'checks':checks,'errors':errors}
          Path('data/verification.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          if status!='ok': raise SystemExit('Deploy payload verification failed')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
