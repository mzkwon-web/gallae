name: Deploy Gallae with live transit data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekdays, roughly 11:00–14:00 KST (02:00–05:00 UTC), every 10 minutes.
    - cron: '*/10 2-4 * * 1-5'
    - cron: '0 5 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live transit data
        env:
          SEOUL_SUBWAY_API_KEY: ${{ secrets.SEOUL_SUBWAY_API_KEY }}
          DATA_GO_KR_BUS_API_KEY: ${{ secrets.DATA_GO_KR_BUS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          kst = timezone(timedelta(hours=9))
          Path('data').mkdir(exist_ok=True)

          # Subway: Gasan Digital Complex Station, Line 7
          subway_key = os.environ.get('SEOUL_SUBWAY_API_KEY')
          subway_payload = {'status':'error','station':'가산디지털단지','line':'7호선','updated_at':datetime.now(kst).isoformat(timespec='seconds'),'arrivals':[]}
          if subway_key:
              try:
                  station = '가산디지털단지'
                  encoded = urllib.parse.quote(station)
                  url = f'http://swopenapi.seoul.go.kr/api/subway/{subway_key}/json/realtimeStationArrival/0/30/{encoded}'
                  req = urllib.request.Request(url, headers={'User-Agent': 'gallae-poc/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = json.loads(response.read().decode('utf-8'))
                  rows = raw.get('realtimeArrivalList', [])
                  line7 = []
                  for row in rows:
                      if str(row.get('subwayId')) != '1007':
                          continue
                      line7.append({
                          'destination': row.get('bstatnNm'),
                          'direction': row.get('updnLine'),
                          'train_line': row.get('trainLineNm'),
                          'arrival_message': row.get('arvlMsg2'),
                          'current_location': row.get('arvlMsg3'),
                          'train_no': row.get('btrainNo'),
                          'received_at': row.get('recptnDt'),
                      })
                  subway_payload.update(status='ok', arrivals=line7[:8])
              except Exception as e:
                  subway_payload['error'] = str(e)
          else:
              subway_payload['error'] = 'SEOUL_SUBWAY_API_KEY is missing'
          Path('data/subway.json').write_text(json.dumps(subway_payload, ensure_ascii=False, indent=2), encoding='utf-8')

          # Bus: user's "롯데캐슬 정류장" = ARS 18514
          # Seoul bus API supports ARS-ID directly and returns XML.
          bus_key = os.environ.get('DATA_GO_KR_BUS_API_KEY')
          bus_payload = {'status':'error','stop_name':'롯데캐슬 정류장','ars_id':'18514','updated_at':datetime.now(kst).isoformat(timespec='seconds'),'arrivals':[]}

          def parse_bus(xml_bytes):
              root = ET.fromstring(xml_bytes)
              header_cd = (root.findtext('.//headerCd') or '').strip()
              header_msg = (root.findtext('.//headerMsg') or '').strip()
              if header_cd not in ('0','00',''):
                  raise RuntimeError(f'{header_cd}: {header_msg}')
              arrivals = []
              for item in root.findall('.//itemList'):
                  def t(name):
                      v = item.findtext(name)
                      return v.strip() if isinstance(v, str) else v
                  arrivals.append({
                      'route': t('rtNm') or t('busRouteAbrv') or t('busRouteNm'),
                      'first_message': t('arrmsg1'),
                      'first_seconds': t('traTime1'),
                      'first_stops': t('sectOrd1'),
                      'second_message': t('arrmsg2'),
                      'second_seconds': t('traTime2'),
                      'second_stops': t('sectOrd2'),
                      'destination': t('stationNm1'),
                  })
              return arrivals

          if bus_key:
              errors = []
              # data.go.kr may expose either an encoded or decoded service key.
              # Try a decoded form first, then the original value without ever logging the key.
              candidates = []
              decoded = urllib.parse.unquote(bus_key)
              for candidate in (decoded, bus_key):
                  if candidate and candidate not in candidates:
                      candidates.append(candidate)
              for candidate in candidates:
                  try:
                      query = 'serviceKey=' + urllib.parse.quote(candidate, safe='') + '&arsId=18514'
                      url = 'http://ws.bus.go.kr/api/rest/stationinfo/getStationByUid?' + query
                      req = urllib.request.Request(url, headers={'User-Agent': 'gallae-poc/1.0'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          xml_bytes = response.read()
                      arrivals = parse_bus(xml_bytes)
                      bus_payload.update(status='ok', arrivals=arrivals)
                      break
                  except Exception as e:
                      errors.append(str(e))
              if bus_payload['status'] != 'ok':
                  bus_payload['error'] = ' / '.join(errors[-2:]) or 'bus api request failed'
          else:
              bus_payload['error'] = 'DATA_GO_KR_BUS_API_KEY is missing'
          Path('data/bus.json').write_text(json.dumps(bus_payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
