name: Deploy Gallae with live subway data

on:
  workflow_dispatch:
  schedule:
    # Weekdays, roughly 11:00–14:00 KST (02:00–05:00 UTC), every 10 minutes.
    - cron: '*/10 2-4 * * 1-5'
    - cron: '0 5 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Gasan Digital Complex Station Line 7 arrivals
        env:
          SEOUL_SUBWAY_API_KEY: ${{ secrets.SEOUL_SUBWAY_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          key = os.environ.get('SEOUL_SUBWAY_API_KEY')
          if not key:
              raise SystemExit('SEOUL_SUBWAY_API_KEY is missing')

          station = '가산디지털단지'
          encoded = urllib.parse.quote(station)
          url = f'http://swopenapi.seoul.go.kr/api/subway/{key}/json/realtimeStationArrival/0/30/{encoded}'

          req = urllib.request.Request(url, headers={'User-Agent': 'gallae-poc/1.0'})
          with urllib.request.urlopen(req, timeout=20) as response:
              raw = json.loads(response.read().decode('utf-8'))

          rows = raw.get('realtimeArrivalList', [])
          line7 = []
          for row in rows:
              if str(row.get('subwayId')) != '1007':
                  continue
              line7.append({
                  'destination': row.get('bstatnNm'),
                  'direction': row.get('updnLine'),
                  'train_line': row.get('trainLineNm'),
                  'arrival_message': row.get('arvlMsg2'),
                  'current_location': row.get('arvlMsg3'),
                  'train_no': row.get('btrainNo'),
                  'express': row.get('btrainSttus'),
                  'received_at': row.get('recptnDt'),
              })

          kst = timezone(timedelta(hours=9))
          payload = {
              'status': 'ok',
              'station': station,
              'line': '7호선',
              'updated_at': datetime.now(kst).isoformat(timespec='seconds'),
              'arrivals': line7[:8],
          }
          Path('data').mkdir(exist_ok=True)
          Path('data/subway.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
