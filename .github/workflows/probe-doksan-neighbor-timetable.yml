name: Probe official timetable rows around Doksan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-doksan-neighbor-timetable.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Inspect official Line 1 rows around Doksan
        run: |
          python - <<'PY'
          import json, urllib.request
          from collections import Counter
          from pathlib import Path
          from openpyxl import load_workbook

          url='https://www.korail.com/file/cubedata/COMMON/jfile/202602/23/2026022319c8818dfa4360.xlsx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 gallae-poc/1.0'})
          with urllib.request.urlopen(req,timeout=40) as r:
              Path('line1.xlsx').write_bytes(r.read())
          wb=load_workbook('line1.xlsx',data_only=False,read_only=True)
          targets={'수원','성균관대','의왕','당정','군포','금정','명학','안양','관악','석수','금천구','독산','가산디지털단지','구로'}
          out={'status':'ok','source':'korail_official_timetable','sheets':{},'dominant_minutes_to_doksan':{}}

          def as_clock(v):
              if v is None: return None
              if hasattr(v,'strftime'):
                  try:return v.strftime('%H:%M:%S')
                  except Exception:return None
              s=str(v).strip()
              return s if len(s)>=7 and ':' in s else None

          def sec(v):
              try:
                  h,m,s=[int(x) for x in v.split(':')]
                  return h*3600+m*60+s
              except Exception:return None

          aggregate={k:[] for k in targets if k!='독산'}
          for sheet in ['경부장항_평일_상','서동탄-의정부_평일_상']:
              if sheet not in wb.sheetnames: continue
              ws=wb[sheet]
              rows={}
              raw_rows=[]
              for row in ws.iter_rows():
                  label=str(row[0].value or '').strip()
                  if label in targets:
                      vals=[]
                      for c in row:
                          v=c.value
                          if hasattr(v,'strftime'):
                              try:v=v.strftime('%H:%M:%S')
                              except Exception:v=str(v)
                          elif v is not None:v=str(v)
                          vals.append(v)
                      rows[label]=vals
                      raw_rows.append({'row':row[0].row,'label':label,'values':vals})
              out['sheets'][sheet]=raw_rows
              doksan=rows.get('독산') or []
              for station,vals in rows.items():
                  if station=='독산': continue
                  deltas=[]
                  for i in range(min(len(vals),len(doksan))):
                      a,b=as_clock(vals[i]),as_clock(doksan[i])
                      if not a or not b: continue
                      sa,sb=sec(a),sec(b)
                      if sa is None or sb is None: continue
                      d=sb-sa
                      if d<0:d+=86400
                      if 0<d<=7200:
                          deltas.append(d)
                          aggregate.setdefault(station,[]).append(d)
                  if deltas:
                      mode,count=Counter(deltas).most_common(1)[0]
                      out.setdefault('sheet_dominant_minutes',{}).setdefault(sheet,{})[station]={
                          'minutes':mode/60,'count':count,'observations':len(deltas)
                      }
          for station,deltas in aggregate.items():
              if not deltas: continue
              mode,count=Counter(deltas).most_common(1)[0]
              out['dominant_minutes_to_doksan'][station]={
                  'minutes':mode/60,'count':count,'observations':len(deltas)
              }
          Path('probe-output').mkdir(exist_ok=True)
          Path('probe-output/doksan-neighbor-timetable.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'status':'ok','dominant_minutes_to_doksan':out['dominant_minutes_to_doksan']},ensure_ascii=False,indent=2))
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doksan-neighbor-timetable-probe
          path: probe-output/doksan-neighbor-timetable.json
