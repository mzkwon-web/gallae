name: Verify phase 2 hybrid runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/phase2-hybrid-input.js'
      - 'lib/schedule-position-eta.js'
      - 'lib/rolling-eta.js'
      - 'lib/phase2-hybrid-runtime.js'
      - 'scripts/build-phase2-runtime.js'
      - 'data/phase2-schedule.json'
      - 'config/phase2-hybrid.json'
      - '.github/workflows/verify-phase2-runtime.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live Doksan Line 1 snapshot
        env:
          SEOUL_SUBWAY_API_KEY: ${{ secrets.SEOUL_SUBWAY_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          key=(os.environ.get('SEOUL_SUBWAY_API_KEY') or '').strip()
          if not key: raise SystemExit('SEOUL_SUBWAY_API_KEY is missing')
          station=urllib.parse.quote('독산')
          url=f'http://swopenapi.seoul.go.kr/api/subway/{key}/json/realtimeStationArrival/0/50/{station}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 gallae-phase2/0.1'})
          with urllib.request.urlopen(req,timeout=25) as response:
              raw=json.loads(response.read().decode('utf-8'))
          rows=[r for r in (raw.get('realtimeArrivalList') or []) if str(r.get('subwayId'))=='1001']
          fields=['subwayId','updnLine','bstatnNm','trainLineNm','btrainNo','btrainSttus','barvlDt','arvlMsg2','arvlMsg3','arvlCd','subwayHeading','recptnDt','statnFid','statnTid','statnId','statnNm','ordkey']
          payload={
              'status':'ok','station':'독산','line':'1호선',
              'updated_at':datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds'),
              'rows':[{k:r.get(k) for k in fields if k in r} for r in rows],
              'row_count':len(rows)
          }
          Path('runtime-input').mkdir(exist_ok=True)
          Path('runtime-input/doksan-line1.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'status':'ok','row_count':len(rows)},ensure_ascii=False))
          if not rows: raise SystemExit('No Line 1 rows returned for Doksan')
          PY

      - name: Build hybrid rolling ETA from live and official schedule inputs
        run: node scripts/build-phase2-runtime.js runtime-input/doksan-line1.json runtime-output/phase2-runtime.json

      - name: Verify runtime invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('runtime-output/phase2-runtime.json','utf8'));
          const errors=[];
          if(!['ok','unavailable'].includes(p.status)) errors.push('invalid runtime status');
          if(p.source_priority.join('>')!=='realtime>schedule>plan>estimate') errors.push('source priority mismatch');
          if(p.target_clock!=='13:50') errors.push('target mismatch');
          if(p.deadline_clock!=='14:00') errors.push('deadline mismatch');
          if(p.status==='ok'){
            if(!p.usable_candidate_count) errors.push('ok without usable candidate');
            for(const item of p.candidates.filter(x=>x.result&&x.result.status==='ok')){
              if(item.result.eta_scope!=='through_sincheon') errors.push('unexpected ETA scope');
              if(item.result.plan_deviation_status!=='planned_departure_missing') errors.push('plan deviation should stay unavailable without plan evidence');
              if(!item.result.legs || item.result.legs.length!==2) errors.push('rolling legs missing');
              if((item.result.legs||[]).some(x=>x.data_source!=='schedule')) errors.push('post-Guro leg did not use schedule fallback');
            }
          }
          const verification={
            status:errors.length?'error':'ok',
            errors,
            runtime_status:p.status,
            realtime_candidate_count:p.realtime_candidate_count,
            usable_candidate_count:p.usable_candidate_count,
            verified_at:new Date().toISOString()
          };
          fs.writeFileSync('runtime-output/verification.json',JSON.stringify(verification,null,2));
          console.log(JSON.stringify(verification,null,2));
          if(errors.length) process.exit(1);
          NODE

      - name: Upload runtime verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-runtime-verification
          path: runtime-output/
          if-no-files-found: error
