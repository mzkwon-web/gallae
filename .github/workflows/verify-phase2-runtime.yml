name: Verify phase 2 hybrid runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/source-types.js'
      - 'lib/phase2-hybrid-input.js'
      - 'lib/schedule-position-eta.js'
      - 'lib/rolling-eta.js'
      - 'lib/phase2-hybrid-runtime.js'
      - 'scripts/build-phase2-runtime.js'
      - 'data/phase2-schedule.json'
      - 'config/phase2-hybrid.json'
      - '.github/workflows/verify-phase2-runtime.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live Doksan Line 1 snapshot
        env:
          SEOUL_SUBWAY_API_KEY: ${{ secrets.SEOUL_SUBWAY_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          key=(os.environ.get('SEOUL_SUBWAY_API_KEY') or '').strip()
          if not key: raise SystemExit('SEOUL_SUBWAY_API_KEY is missing')
          station=urllib.parse.quote('독산')
          url=f'http://swopenapi.seoul.go.kr/api/subway/{key}/json/realtimeStationArrival/0/50/{station}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 gallae-phase2/0.1'})
          with urllib.request.urlopen(req,timeout=25) as response: raw=json.loads(response.read().decode('utf-8'))
          rows=[r for r in (raw.get('realtimeArrivalList') or []) if str(r.get('subwayId'))=='1001']
          fields=['subwayId','updnLine','bstatnNm','trainLineNm','btrainNo','btrainSttus','barvlDt','arvlMsg2','arvlMsg3','arvlCd','subwayHeading','recptnDt','statnFid','statnTid','statnId','statnNm','ordkey']
          payload={'status':'ok','station':'독산','line':'1호선','updated_at':datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds'),'rows':[{k:r.get(k) for k in fields if k in r} for r in rows],'row_count':len(rows)}
          Path('runtime-input').mkdir(exist_ok=True)
          Path('runtime-input/doksan-line1.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'status':'ok','row_count':len(rows),'live_rows_available':bool(rows)},ensure_ascii=False))
          PY

      - name: Build hybrid rolling ETA from live and official schedule inputs
        run: node scripts/build-phase2-runtime.js runtime-input/doksan-line1.json runtime-output/phase2-runtime.json

      - name: Verify runtime invariants and plan-deviation regression
        run: |
          node - <<'NODE'
          const fs=require('fs');
          require('./lib/source-types.js');
          require('./lib/phase2-hybrid-input.js');
          require('./lib/schedule-position-eta.js');
          require('./lib/rolling-eta.js');
          require('./lib/phase2-hybrid-runtime.js');
          const p=JSON.parse(fs.readFileSync('runtime-output/phase2-runtime.json','utf8'));
          const schedule=JSON.parse(fs.readFileSync('data/phase2-schedule.json','utf8'));
          const policy=JSON.parse(fs.readFileSync('config/phase2-hybrid.json','utf8'));
          const errors=[];
          const canonicalSources=['api','measured','preference','constraint','rule','schedule','calculated','experience'];
          const sameSources=(items)=>JSON.stringify(items||[])===JSON.stringify(canonicalSources);
          if(!sameSources(globalThis.GallaeSourceTypes&&globalThis.GallaeSourceTypes.SOURCE_TYPES)) errors.push('canonical source registry mismatch');
          if(!sameSources(globalThis.GallaePhase2HybridInput&&globalThis.GallaePhase2HybridInput.SOURCE_TYPES)) errors.push('phase2 input source registry drift');
          if(!sameSources(globalThis.GallaeRollingETA&&globalThis.GallaeRollingETA.ALLOWED_SOURCES)) errors.push('rolling ETA source registry drift');
          if(!['ok','unavailable'].includes(p.status)) errors.push('invalid runtime status');
          if(p.source_priority.join('>')!=='realtime>schedule/plan>estimate') errors.push('source priority mismatch');
          if(p.target_clock!=='13:50') errors.push('target mismatch');
          if(p.deadline_clock!=='14:00') errors.push('deadline mismatch');
          if(p.final_access_minutes!==10) errors.push(`unexpected final access ${p.final_access_minutes}`);
          if(p.final_access_source!=='measured') errors.push('final access source mismatch');
          const ov=p.operational_validation||{}, ovContract=p.operational_validation_contract||{};
          if(!new Set(['before','within','after','unavailable']).has(ov.status)) errors.push(`invalid operational validation status ${ov.status}`);
          if(ovContract.status!=='ok'||(ovContract.errors||[]).length) errors.push('operational validation contract failed');
          if(typeof ov.decision_usable!=='boolean') errors.push('decision_usable must be boolean');
          if(ov.decision_usable && !(ov.status==='within' && p.status==='ok' && p.usable_candidate_count>0)) errors.push('decision_usable requires within + usable candidate');
          if(!Array.isArray(ov.evidence)||!ov.evidence.some(x=>x&&x.source==='rule')) errors.push('operational validation rule evidence missing');
          if(p.planned_departure_status==='derived_from_schedule_plan'){
            if(!p.planned_departure_at || new Date(p.planned_departure_at).toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul',hour12:false})!=='12:57:30') errors.push(`unexpected planned departure ${p.planned_departure_at}`);
          } else if(p.planned_departure_status==='unavailable'){
            if(p.planned_departure_at!==null) errors.push('unavailable planned departure must be null');
            if(ov.status!=='unavailable'||ov.decision_usable!==false) errors.push('unavailable live runtime must not be decision usable');
            if(!ov.evidence.some(x=>x&&x.source==='constraint')) errors.push('unavailable live runtime constraint evidence missing');
          } else {
            errors.push(`invalid planned departure status ${p.planned_departure_status}`);
          }

          function rawRow(observed){return {subwayId:'1001',statnNm:'독산',updnLine:'상행',trainLineNm:'광운대행 - 가산디지털단지방면',bstatnNm:'광운대',btrainNo:'TEST',btrainSttus:'일반',barvlDt:'0',arvlMsg2:'[2]번째 전역 (석수)',arvlMsg3:'석수',arvlCd:'99',recptnDt:observed,statnFid:'1001080144',statnTid:'1001080142',ordkey:'test'};}
          function scenario(observed,snapshot){return globalThis.GallaePhase2HybridRuntime.buildFromRows({rows:[rawRow(observed)],schedule,policy,snapshot_at:snapshot,planned_departure_at:'2026-08-25T12:57:00+09:00',final_access_minutes:null});}
          const onPlan=scenario('2026-08-25 12:50:00','2026-08-25T12:50:00+09:00');
          const delayed=scenario('2026-08-25 13:00:00','2026-08-25T13:00:00+09:00');
          const a=onPlan.ranked[0], b=delayed.ranked[0];
          if(!a||!b) errors.push('synthetic rolling candidate missing');
          if(a&&a.plan_deviation_minutes!==-1.5) errors.push(`unexpected early plan deviation ${a.plan_deviation_minutes}`);
          if(b&&b.plan_deviation_minutes!==8.5) errors.push(`unexpected delayed plan deviation ${b.plan_deviation_minutes}`);
          if(a&&a.legs[0].departure_at!=='2026-08-25T13:13:30+09:00') errors.push(`minimum transfer not applied at Guro: ${a.legs[0].departure_at}`);
          if(a&&a.legs[1].departure_at!=='2026-08-25T13:42:30+09:00') errors.push(`minimum transfer not applied at Sosa: ${a.legs[1].departure_at}`);
          if(b&&b.legs[0].departure_at!=='2026-08-25T13:23:00+09:00') errors.push(`delayed Guro connection wrong after min transfer: ${b.legs[0].departure_at}`);
          if(b&&b.legs[1].departure_at!=='2026-08-25T13:42:30+09:00') errors.push(`delayed Sosa connection wrong after min transfer: ${b.legs[1].departure_at}`);
          for(const c of [a,b].filter(Boolean)) for(const leg of c.legs||[]) if(leg.min_transfer_minutes!==3) errors.push(`default minimum transfer mismatch ${leg.min_transfer_minutes}`);
          const R=globalThis.GallaeRollingETA;
          const transferProbe=R.rollLeg('2026-08-25T13:02:00+09:00',{id:'probe',connections:[{departure_at:'2026-08-25T13:04:30+09:00',arrival_at:'2026-08-25T13:19:30+09:00',data_source:'schedule'},{departure_at:'2026-08-25T13:13:30+09:00',arrival_at:'2026-08-25T13:28:30+09:00',data_source:'schedule'}]});
          if(transferProbe.departure_at!=='2026-08-25T13:13:30+09:00') errors.push('connection inside 3-minute transfer window was incorrectly allowed');
          const overrideProbe=R.rollLeg('2026-08-25T13:02:00+09:00',{id:'override',min_transfer_minutes:2,connections:[{departure_at:'2026-08-25T13:04:30+09:00',arrival_at:'2026-08-25T13:19:30+09:00',data_source:'schedule'}]});
          if(overrideProbe.departure_at!=='2026-08-25T13:04:30+09:00'||overrideProbe.min_transfer_minutes!==2) errors.push('leg minimum-transfer override failed');
          if(a&&a.margin_state!=='urgent') errors.push(`early scenario should become urgent after realistic transfers: ${a.margin_state}`);
          if(b&&b.deadline_state!=='late') errors.push('delayed scenario should be late');
          const verification={status:errors.length?'error':'ok',errors,source_types:canonicalSources,runtime_status:p.status,realtime_candidate_count:p.realtime_candidate_count,usable_candidate_count:p.usable_candidate_count,planned_departure_status:p.planned_departure_status,planned_departure_at:p.planned_departure_at,final_access_minutes:p.final_access_minutes,minimum_transfer_minutes:3,operational_validation:{status:ov.status,decision_usable:ov.decision_usable,contract_status:ovContract.status},regression:{early:a?{plan_deviation_minutes:a.plan_deviation_minutes,final_eta:a.final_eta,deadline_state:a.deadline_state,margin_state:a.margin_state,legs:a.legs.map(x=>({departure_at:x.departure_at,arrival_at:x.arrival_at,min_transfer_minutes:x.min_transfer_minutes}))}:null,delayed:b?{plan_deviation_minutes:b.plan_deviation_minutes,final_eta:b.final_eta,deadline_state:b.deadline_state,margin_state:b.margin_state,legs:b.legs.map(x=>({departure_at:x.departure_at,arrival_at:x.arrival_at,min_transfer_minutes:x.min_transfer_minutes}))}:null},verified_at:new Date().toISOString()};
          fs.writeFileSync('runtime-output/verification.json',JSON.stringify(verification,null,2));
          console.log(JSON.stringify(verification,null,2));
          if(errors.length) process.exit(1);
          NODE

      - name: Upload runtime verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-runtime-verification
          path: runtime-output/
          if-no-files-found: error
