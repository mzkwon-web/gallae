name: Probe Gwangsa Gyeonggi bus realtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-gwangsa-bus.yml'
  schedule:
    - cron: '40,50 3 * * 1-5'
    - cron: '0,10,20 4 * * 1-5'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve stop 14057 and fetch live arrivals
        env:
          GYEONGGI_BUS_API_KEY: ${{ secrets.DATA_GO_KR_BUS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          kst = timezone(timedelta(hours=9))
          observed = datetime.now(kst)
          now = observed.isoformat(timespec='seconds')
          out = {
              'status':'error',
              'source':'gyeonggi_bus_api',
              'stop_alias':'광사 정류장',
              'official_stop_name':'광명사거리역.한진아파트',
              'mobile_no':'14057',
              'updated_at':now,
              'station':None,
              'station_resolution':None,
              'arrivals':[],
              'candidate_count':0,
              'request_attempts':{},
              'request_endpoint':{},
              'endpoint_errors':{},
              'error':None,
          }

          def fetch_json(label, base, params, attempts=2, timeout=15):
              key = (os.environ.get('GYEONGGI_BUS_API_KEY') or '').strip()
              if not key:
                  raise RuntimeError('GYEONGGI_BUS_API_KEY is missing')
              params = dict(params)
              params.update({'format':'json','serviceKey':urllib.parse.unquote(key)})
              query = urllib.parse.urlencode(params, safe='%')
              req = urllib.request.Request(base + '?' + query, headers={'User-Agent':'Mozilla/5.0 gallae-poc/1.0'})
              errors = []
              endpoint_key = f'{label}:{base}'
              for attempt in range(1, attempts + 1):
                  out['request_attempts'][endpoint_key] = attempt
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode('utf-8', errors='replace'))
                  except (TimeoutError, urllib.error.URLError) as exc:
                      errors.append(f'attempt {attempt}: {exc}')
                      if attempt < attempts:
                          time.sleep(attempt * 2)
              out['endpoint_errors'][endpoint_key] = errors
              raise RuntimeError(f'{label} failed after {attempts} attempts: ' + ' | '.join(errors))

          def fetch_json_any(label, endpoints, params, attempts=2, timeout=15):
              errors = []
              for endpoint in endpoints:
                  try:
                      payload = fetch_json(label, endpoint, params, attempts=attempts, timeout=timeout)
                      out['request_endpoint'][label] = endpoint
                      return payload
                  except Exception as exc:
                      errors.append(f'{endpoint}: {exc}')
              raise RuntimeError(f'{label} failed on all endpoints: ' + ' || '.join(errors))

          def response_parts(raw):
              response = raw.get('response', {}) if isinstance(raw, dict) else {}
              header = response.get('msgHeader', {}) if isinstance(response, dict) else {}
              code = str(header.get('resultCode',''))
              message = header.get('resultMessage') or header.get('resultMsg') or ''
              if code not in ('0','00'):
                  raise RuntimeError(f'GYEONGGI {code}: {message}')
              body = response.get('msgBody', {}) if isinstance(response, dict) else {}
              return body if isinstance(body, dict) else {}

          def as_list(value):
              if isinstance(value, dict):
                  return [value]
              return value if isinstance(value, list) else []

          def station_from_item(item):
              station_id = str(item.get('stationId') or '').strip()
              if not station_id:
                  return None
              return {
                  'stationId':station_id,
                  'mobileNo':str(item.get('mobileNo') or '').strip(),
                  'stationName':item.get('stationName'),
                  'regionName':item.get('regionName'),
              }

          def resolve_station_direct():
              raw = fetch_json_any(
                  'station_lookup',
                  [
                      'https://apis.data.go.kr/6410000/busstationservice/v2/getBusStationListv2',
                      'https://apis.data.go.kr/6410000/busstationservice/getBusStationList',
                  ],
                  {'keyword':'14057'}
              )
              stations = as_list(response_parts(raw).get('busStationList'))
              matches = [s for s in stations if str(s.get('mobileNo','')).strip() == '14057']
              if not matches:
                  raise RuntimeError('No exact Gyeonggi station match for mobileNo 14057')
              station = station_from_item(matches[0])
              if not station:
                  raise RuntimeError('Matched stop has no stationId')
              return station, 'station_lookup'

          def resolve_station_via_route(route_name='27'):
              route_raw = fetch_json_any(
                  'route_lookup',
                  [
                      'https://apis.data.go.kr/6410000/busrouteservice/v2/getBusRouteListv2',
                      'https://apis.data.go.kr/6410000/busrouteservice/getBusRouteList',
                  ],
                  {'keyword':route_name}
              )
              routes = as_list(response_parts(route_raw).get('busRouteList'))
              exact = [r for r in routes if str(r.get('routeName') or '').strip() == route_name]
              if not exact:
                  raise RuntimeError(f'No exact Gyeonggi route match for routeName {route_name}')
              route_errors = []
              for route in exact:
                  route_id = str(route.get('routeId') or '').strip()
                  if not route_id:
                      continue
                  label = f'route_stations_{route_id}'
                  try:
                      stations_raw = fetch_json_any(
                          label,
                          [
                              'https://apis.data.go.kr/6410000/busrouteservice/v2/getBusRouteStationListv2',
                              'https://apis.data.go.kr/6410000/busrouteservice/getBusRouteStationList',
                          ],
                          {'routeId':route_id}
                      )
                      stations = as_list(response_parts(stations_raw).get('busRouteStationList'))
                      matches = [s for s in stations if str(s.get('mobileNo','')).strip() == '14057']
                      if matches:
                          station = station_from_item(matches[0])
                          if station:
                              station['resolvedViaRouteId'] = route_id
                              station['resolvedViaRouteName'] = route_name
                              return station, 'route_station_list'
                  except Exception as exc:
                      route_errors.append(f'{route_id}: {exc}')
              raise RuntimeError('Route fallback did not resolve mobileNo 14057' + (': ' + ' || '.join(route_errors) if route_errors else ''))

          def positive_seconds(value):
              try:
                  seconds = int(value)
              except (TypeError, ValueError):
                  return None
              return seconds if seconds > 0 else None

          try:
              direct_error = None
              try:
                  station, resolution = resolve_station_direct()
              except Exception as exc:
                  direct_error = str(exc)
                  station, resolution = resolve_station_via_route('27')
                  out['endpoint_errors']['direct_station_resolution'] = [direct_error]

              station_id = station['stationId']
              out['station'] = station
              out['station_resolution'] = resolution

              arrival_raw = fetch_json_any(
                  'arrival_lookup',
                  [
                      'https://apis.data.go.kr/6410000/busarrivalservice/v2/getBusArrivalListv2',
                      'https://apis.data.go.kr/6410000/busarrivalservice/getBusStationArrivalList',
                  ],
                  {'stationId':station_id},
                  attempts=2,
                  timeout=20
              )
              arrivals = as_list(response_parts(arrival_raw).get('busArrivalList'))
              fields = [
                  'routeId','routeName','routeTypeCd','routeDestId','routeDestName','flag','staOrder','turnSeq',
                  'predictTime1','predictTimeSec1','locationNo1','stationNm1','stateCd1',
                  'predictTime2','predictTimeSec2','locationNo2','stationNm2','stateCd2'
              ]
              normalized = []
              for item in arrivals:
                  row = {k:item.get(k) for k in fields if k in item}
                  seconds = positive_seconds(item.get('predictTimeSec1'))
                  row['predicted_arrival_at'] = (observed + timedelta(seconds=seconds)).isoformat(timespec='seconds') if seconds else None
                  row['data_source'] = 'realtime'
                  row['evidence'] = [
                      {'source':'api','text':'경기도 버스도착정보 API의 광사 정류장 실시간 도착예측'},
                      {'source':'rule','text':'predictTimeSec1이 양수일 때 probe 관측시각에 더해 탑승 가능 예정시각으로 정규화'}
                  ]
                  if resolution == 'route_station_list':
                      row['evidence'].append({'source':'rule','text':'정류소 검색 API 장애 시 공식 노선 경유정류소 목록의 mobileNo 14057로 stationId를 교차 해석'})
                  if seconds is None:
                      row['evidence'].append({'source':'constraint','text':'유효한 predictTimeSec1이 없어 탑승 예정시각을 계산하지 않음'})
                  normalized.append(row)
              out['arrivals'] = normalized
              out['candidate_count'] = sum(1 for row in normalized if row.get('predicted_arrival_at'))
              out['status'] = 'ok'
          except Exception as e:
              out['error'] = str(e)

          Path('probe-output').mkdir(exist_ok=True)
          Path('probe-output/gwangsa-bus.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False, indent=2))
          if out['status'] != 'ok':
              raise SystemExit(out['error'])
          PY

      - name: Verify normalized candidates
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('probe-output/gwangsa-bus.json').read_text(encoding='utf-8'))
          if payload.get('status') != 'ok':
              raise SystemExit('gwangsa probe status is not ok')
          if not payload.get('station') or payload['station'].get('mobileNo') != '14057':
              raise SystemExit('exact Gwangsa stop resolution was not preserved')
          if payload.get('station_resolution') not in {'station_lookup','route_station_list'}:
              raise SystemExit('station resolution provenance is missing')
          if not payload.get('request_endpoint', {}).get('arrival_lookup'):
              raise SystemExit('successful probe did not preserve arrival endpoint provenance')
          for row in payload.get('arrivals') or []:
              if row.get('predicted_arrival_at') and row.get('data_source') != 'realtime':
                  raise SystemExit('normalized realtime candidate lost data_source')
              sources = {item.get('source') for item in row.get('evidence') or []}
              if row.get('predicted_arrival_at') and not {'api','rule'}.issubset(sources):
                  raise SystemExit('normalized candidate evidence is incomplete')
          print(json.dumps({
              'status':'ok',
              'station':payload.get('station'),
              'station_resolution':payload.get('station_resolution'),
              'arrival_count':len(payload.get('arrivals') or []),
              'candidate_count':payload.get('candidate_count'),
              'request_attempts':payload.get('request_attempts'),
              'request_endpoint':payload.get('request_endpoint')
          }, ensure_ascii=False))
          PY

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwangsa-bus-probe
          path: probe-output/gwangsa-bus.json
          if-no-files-found: error