<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>갈래 필드테스트</title><style>
:root{--bg:#101216;--card:#181b21;--line:#2b3038;--tx:#f6f7f9;--mut:#9da5b0;--ok:#42c98b;--bad:#ff6b6b;--ac:#ff6846}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}main{max-width:850px;margin:auto;padding:24px 14px 60px}h1{margin:4px 0 8px;font-size:34px}.sub,.mut{color:var(--mut)}.summary,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.summary{padding:16px;margin:18px 0}.counts{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 11px;border-radius:10px;background:#111419;border:1px solid var(--line)}.bar{height:10px;background:#252a31;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:0;background:var(--ac)}section{margin-top:14px}.head{padding:14px 16px;font-weight:800;border-bottom:1px solid var(--line)}.item{padding:14px 16px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.title{font-weight:800}.desc{font-size:13px;color:var(--mut);margin:3px 0 8px}button{border:1px solid var(--line);background:#111419;color:var(--mut);border-radius:9px;padding:9px 13px;font-weight:800;margin-right:6px;min-height:40px}button.on.ok{color:var(--ok);border-color:var(--ok);background:#173126}button.on.bad{color:var(--bad);border-color:var(--bad);background:#321d20}textarea{width:100%;min-height:82px;margin-top:9px;background:#0e1115;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;resize:vertical}.log{padding:16px}.log textarea{min-height:170px}.actions{margin-top:16px}@media(max-width:500px){h1{font-size:29px}button{padding:9px 11px}}
</style></head><body><main><div class="mut">GALLE · FIELD QA</div><h1>갈래 필드테스트</h1><p class="sub">각 항목을 성공 / 실패 / 미판정으로 기록하고, 실시간 조회값과 현장 근거를 함께 남깁니다.</p><div class="summary"><b id="pct">0%</b><div class="bar"><i id="bar"></i></div><div class="counts"><span class="pill">성공 <b id="s">0</b></span><span class="pill">실패 <b id="f">0</b></span><span class="pill">미판정 <b id="p">21</b></span></div></div><div id="app"></div><section class="card log"><div class="title">실시간 데이터 원문 / 현장 로그</div><p class="desc">API 응답, 갈래 화면 표시값, 실제 전광판·탑승 상황을 그대로 붙여넣어 비교하세요.</p><textarea id="global" placeholder="예) 17:42 갈래 조회 / 데이터 기준시각 17:41 / 석남행 2분 후 / 실제 전광판 석남행 진입중"></textarea></section><div class="actions"><button id="reset">전체 초기화</button></div></main><script>
const ITEMS=[["수요일 · 첫 필드테스트", "출발 전 1차 판단", "13:50 목표 기준 가산 7호선 vs 독산 1호선 비교. 계획 탑승시각과 현재 이용 가능한 열차 차이 확인."], ["수요일 · 첫 필드테스트", "이동 중 2차 판단", "실제 열차 탑승 후 다음 환승 가능성과 시흥여성인력개발센터 최종 ETA 재계산."], ["수요일 · 첫 필드테스트", "지연·환승 직전 3차 판단", "기존 경로 유지 vs fallback 비교. 지연이 없다면 경로 변경 불필요도 정상 결과."], ["수요일 · 첫 필드테스트", "필드테스트 실측값 기록", "추천/실제 출발시각, 추천 경로, 실제 탑승·환승, 추천 ETA, 실제 도착시각 기록."], ["오늘 함께 검증할 기반 기능", "가산 7호선 실시간 freshness", "조회 시점의 최신 데이터인지 확인. stale 데이터는 LIVE로 사용하지 않음."], ["오늘 함께 검증할 기반 기능", "서울 버스 실시간", "실제 도착정보 표시와 freshness를 확인."], ["오늘 함께 검증할 기반 기능", "독산역 1호선 실시간", "구로 방향 현재 이용 가능한 열차가 실제 운영시간대에 맞게 표시되는지 확인."], ["오늘 함께 검증할 기반 기능", "시흥 사전 시간표 plan/schedule", "공식 계획 데이터가 실제 판단에 연결되는지 확인."], ["오늘 함께 검증할 기반 기능", "plan_deviation 실값", "계획 탑승시각 대비 현재 이용 가능 시각의 +N분 편차 확인."], ["오늘 함께 검증할 기반 기능", "13:50 목표 / 14:00 deadline", "목표 도착과 일정 시작을 별도 값으로 유지하고 deadline margin 동작 확인."], ["목요일 · rolling ETA 개발·재검증", "독산→구로 ETA 재검증", "현재 이용 가능한 독산 1호선에서 구로 도착 예상 계산."], ["목요일 · rolling ETA 개발·재검증", "구로→소사 다음 연결편 탐색", "구로 도착 예상시각 이후 실제 탑승 가능한 소사 방향 연결편 탐색."], ["목요일 · rolling ETA 개발·재검증", "소사→신천 schedule/plan fallback", "서울 API 미제공 구간은 정적 시간표로 hybrid rolling ETA 연결."], ["목요일 · rolling ETA 개발·재검증", "시흥 경로 전체 rolling ETA", "최종 목적지 ETA까지 연결하고 실제 도착과 오차 비교."], ["목요일 · rolling ETA 개발·재검증", "환승 가능성 계산", "connection/transfer_margin을 다음 연결편 선택에 반영."], ["목요일 · rolling ETA 개발·재검증", "이동 중 재판단", "현재 위치·시각을 새 출발점으로 판단 엔진 반복 실행."], ["금요일 · 시흥 특화 v0.1 마감", "시흥여성인력개발센터 E2E 검증", "13:50 목표→현재 상태→추천 경로→다음 연결편→최종 ETA 검증."], ["금요일 · 시흥 특화 v0.1 마감", "deadline 위협 시 fallback 비교", "14:00 위협 시 기존 경로와 광사 버스 등 대안을 비교."], ["금요일 · 시흥 특화 v0.1 마감", "경험·선호 보정 실제 후보 비교", "deadline 이전에는 편의·안정성 선호가 작동하는지 확인."], ["금요일 · 시흥 특화 v0.1 마감", "source/evidence 추적", "schedule/plan, api, calculated 등 판단 근거 일관성 확인."], ["금요일 · 시흥 특화 v0.1 마감", "금요일 오전 v0.1 성공 기준 확인", "출발 전·이동 중·위험 시점에서 재판단하고 실제 결과와 비교 가능한지 확인."]]; const KEY='gallae-field-qa-v1';let st={r:{},n:{},g:''};try{st=Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}const app=document.getElementById('app');let last='';ITEMS.forEach((x,i)=>{if(x[0]!==last){last=x[0];app.insertAdjacentHTML('beforeend',`<section class="card"><div class="head">${last}</div><div class="items"></div></section>`);}app.lastElementChild.lastElementChild.insertAdjacentHTML('beforeend',`<div class="item" data-i="${i}"><div class="title">${x[1]}</div><div class="desc">${x[2]}</div><button data-v="ok">성공</button><button data-v="bad">실패</button><button data-v="clear">미판정</button><textarea data-note="${i}" placeholder="실시간 조회값·화면 표시값·실제 상황 등 근거 기록"></textarea></div>`);});function save(){localStorage.setItem(KEY,JSON.stringify(st))}function draw(){let s=0,f=0;document.querySelectorAll('.item').forEach(el=>{let i=el.dataset.i,v=st.r[i];el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v||'clear')));el.querySelector('textarea').value=st.n[i]||'';if(v==='ok')s++;if(v==='bad')f++;});global.value=st.g||'';let p=ITEMS.length-s-f,q=Math.round((s+f)/ITEMS.length*100);pct.textContent=q+'%';bar.style.width=q+'%';document.getElementById('s').textContent=s;document.getElementById('f').textContent=f;document.getElementById('p').textContent=p}document.addEventListener('click',e=>{let b=e.target.closest('.item button');if(!b)return;let i=b.closest('.item').dataset.i;if(b.dataset.v==='clear')delete st.r[i];else st.r[i]=b.dataset.v;save();draw()});document.addEventListener('input',e=>{if(e.target.dataset.note!==undefined)st.n[e.target.dataset.note]=e.target.value;if(e.target.id==='global')st.g=e.target.value;save()});reset.onclick=()=>{st={r:{},n:{},g:''};localStorage.removeItem(KEY);draw()};draw();</script></body></html>
